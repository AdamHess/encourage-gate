[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "encourage-gate"
version = "0.1.0"
description = "Chained profanity/toxicity gate that rewrites harsh prompts via any LLM provider, served over a Unix domain socket for minimal per-call overhead."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
authors = [{ name = "encourage-gate contributors" }]
keywords = ["profanity", "toxicity", "detoxify", "llm", "claude-code", "hook"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "detoxify>=0.5.2",
    "better-profanity>=0.7.0",
    "litellm>=1.50.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.5",
    "vadersentiment>=3.3.2",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
openai = ["openai>=1.50.0"]
google = ["google-generativeai>=0.8.0"]
groq = ["groq>=0.11.0"]
mistral = ["mistralai>=1.2.0"]

[project.urls]
Homepage = "https://github.com/your-org/encourage-gate"
Repository = "https://github.com/your-org/encourage-gate"
Issues = "https://github.com/your-org/encourage-gate/issues"

[project.scripts]
encourage-gate-server = "encourage_gate.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/encourage_gate"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "pyright>=1.1.380",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that load the Detoxify model (slow, ~500MB download on first run)",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I"]
